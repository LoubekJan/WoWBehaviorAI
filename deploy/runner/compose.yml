# Shared build runner for Realm Lab CI/CD. The canonical deployment runner
# is defined separately in compose.lab.yml; the old Elwynn deploy service is
# retired. Keep this project name to retain runner-ci-runner-1 identity.
name: runner
services:
  ci-runner:
    build:
      context: .
    restart: unless-stopped
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: ${GH_RUNNER_REPO_URL}
      ACCESS_TOKEN: ${GH_RUNNER_PAT}
      RUNNER_NAME: ${GH_CI_RUNNER_NAME:-wow-ci-runner}
      RUNNER_WORKDIR: /home/voslik/ci-runner-work
      LABELS: self-hosted,linux,docker,wow,ci
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/voslik/ci-runner-work:/home/voslik/ci-runner-work

# Only used for isolated CI builds; never use this overlay for runtime startup.
name: aitc-lab-ci
volumes:
  auth-mysql-data:
    name: aitc_auth_ci_mysql-unused
  mysql-data:
    name: aitc_lab_ci_mysql-unused
  build-data:
    name: aitc_lab_ci_build-data
  ccache-data:
    name: aitc_lab_ci_ccache-data
  character-studio-data:
    name: aitc_lab_ci_character-studio-unused

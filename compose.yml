# Complete authored-world stack. Existing realm, character and build storage
# retain their deployed identities; auth owns a separate database volume.
# docker compose --env-file .env -f compose.yml up -d
name: aitc-lab

x-trinity-build: &trinity-build
  context: .
  dockerfile: docker/trinitycore/Dockerfile.dev
  args:
    USER_UID: ${DEV_UID:-1000}
    USER_GID: ${DEV_GID:-1000}

x-lab-environment: &lab-environment
  TC_DB_USER: ${TC_DB_USER:?Set the dedicated lab DB user}
  TC_DB_PASSWORD: ${TC_DB_PASSWORD:?Set the dedicated lab DB password}
  TC_AUTH_DB_HOST: ${TC_AUTH_DB_HOST:-aiworld-auth-db}
  TC_AUTH_DB_PORT: ${TC_AUTH_DB_PORT:-3306}
  TC_AUTH_DB_USER: ${TC_AUTH_DB_USER:?Set the dedicated shared-auth user}
  TC_AUTH_DB_PASSWORD: ${TC_AUTH_DB_PASSWORD:?Set the shared-auth password}
  LAB_REALM_ID: ${LAB_REALM_ID:-2}
  LAB_REALM_NAME: ${LAB_REALM_NAME:-AI World Lab}
  LAB_REALM_ADDRESS: ${LAB_REALM_ADDRESS:?Set the client-reachable address}
  LAB_REALM_LOCAL_ADDRESS: ${LAB_REALM_LOCAL_ADDRESS:?Set the LAN address}
  LAB_REALM_LOCAL_SUBNET_MASK: ${LAB_REALM_LOCAL_SUBNET_MASK:-255.255.255.0}
  LAB_WORLD_PORT: ${LAB_WORLD_PORT:-9086}
  LAB_SOAP_ENABLED: ${LAB_SOAP_ENABLED:-1}
  LAB_AI_PROFILE: ${LAB_AI_PROFILE:-settlement-v8}
  LAB_WILDLIFE_ENABLED: ${LAB_WILDLIFE_ENABLED:-1}
  LAB_NPC_AGENTS_ENABLED: ${LAB_NPC_AGENTS_ENABLED:-0}
  LAB_NPC_AGENTS_DECISION_INTERVAL_MS: ${LAB_NPC_AGENTS_DECISION_INTERVAL_MS:-8000}
  LAB_NPC_AGENTS_MAX_IN_FLIGHT: ${LAB_NPC_AGENTS_MAX_IN_FLIGHT:-2}
  LAB_NPC_AGENTS_TIMEOUT_MS: ${LAB_NPC_AGENTS_TIMEOUT_MS:-15000}
  WORLD_VIEWER_TELEMETRY_TOKEN: ${WORLD_VIEWER_TELEMETRY_TOKEN:?Set a separate lab token}

services:
  auth-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD:?Set the separate auth MySQL root password}
      TC_AUTH_SERVER_USER: ${TC_AUTH_SERVER_USER:?Set the auth schema owner}
      TC_AUTH_SERVER_PASSWORD: ${TC_AUTH_SERVER_PASSWORD:?Set the auth schema owner password}
      TC_AUTH_DB_USER: ${TC_AUTH_DB_USER:?Set the world login database user}
      TC_AUTH_DB_PASSWORD: ${TC_AUTH_DB_PASSWORD:?Set the world login database password}
    networks:
      default:
        aliases: [aiworld-auth-db]
    volumes:
      - auth-mysql-data:/var/lib/mysql
      - ./deploy/auth/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, --protocol=TCP, -h, 127.0.0.1]
      interval: 5s
      timeout: 5s
      retries: 30

  authserver:
    build: *trinity-build
    image: aitc-lab-trinity-dev
    restart: unless-stopped
    depends_on:
      auth-mysql:
        condition: service_healthy
    working_dir: /build/bin
    command: [python3, /workspace/tools/realm_lab/auth.py, run-auth, /etc/trinitycore/authserver.conf, /build/bin/authserver]
    environment:
      TC_AUTH_DB_HOST: ${TC_AUTH_DB_HOST:-aiworld-auth-db}
      TC_AUTH_DB_PORT: ${TC_AUTH_DB_PORT:-3306}
      TC_AUTH_SERVER_USER: ${TC_AUTH_SERVER_USER:?Set the auth schema owner}
      TC_AUTH_SERVER_PASSWORD: ${TC_AUTH_SERVER_PASSWORD:?Set the auth schema owner password}
    volumes:
      - build-data:/build:ro
      - ./deploy/authserver.conf:/etc/trinitycore/authserver.conf:ro
      - ./tools/realm_lab:/workspace/tools/realm_lab:ro
      - ./sql:/workspace/sql:ro
      - ./runtime/lab/logs:/runtime/logs
    ports:
      - "${AUTHSERVER_PORT:-3724}:3724"
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/3724"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  account-web:
    build: {context: docker/account-web}
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_healthy
    environment:
      TC_SOAP_URL: http://worldserver:7878
      TC_SOAP_USER: ${TC_SOAP_USER:-}
      TC_SOAP_PASSWORD: ${TC_SOAP_PASSWORD:-}
      TC_ACCOUNT_EXPANSION: "2"
    ports:
      - "${ACCOUNT_WEB_PORT:-9088}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the lab MySQL root password}
      TC_DB_USER: ${TC_DB_USER:?Set the dedicated lab DB user}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:?Set the dedicated lab DB password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/lab/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, --protocol=TCP, -h, 127.0.0.1]
      interval: 5s
      timeout: 5s
      retries: 30

  worldserver:
    build: *trinity-build
    image: aitc-lab-trinity-dev
    restart: unless-stopped
    depends_on:
      lab-mysql:
        condition: service_healthy
      auth-mysql:
        condition: service_healthy
      authserver:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    working_dir: /build/bin
    command: [python3, /workspace/tools/realm_lab/manage.py, run-world, /etc/trinitycore/worldserver.conf, /build/bin/worldserver]
    environment: *lab-environment
    volumes:
      - build-data:/build:ro
      - ./deploy/worldserver.conf:/etc/trinitycore/worldserver.conf:ro
      - ./tools/realm_lab:/workspace/tools/realm_lab:ro
      - ./data/realm_lab:/workspace/data/realm_lab:ro
      - ./data/npc_agents:/workspace/data/npc_agents:ro
      - ./data/npc_appearances:/workspace/data/npc_appearances:ro
      - ./data/npc_templates:/workspace/data/npc_templates:ro
      - ./sql:/workspace/sql:ro
      - ./runtime/lab/data:/runtime/data:ro
      - ./runtime/lab/logs:/runtime/logs
    ports:
      - "${LAB_WORLD_PORT:-9086}:8085"
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  ai-server:
    build: {context: docker/ai}
    restart: unless-stopped
    environment:
      # Each model-backed feature has independent, explicit enablement.
      AI_TASK_MODEL_ENABLED: "0"
      AI_RECOVERY_MODEL_ENABLED: "0"
      AI_TASK_MODEL_URL: ${AI_TASK_MODEL_URL:-}
      AI_TASK_MODEL_NAME: ${AI_TASK_MODEL_NAME:-}
      AI_TASK_MODEL_API_KEY: ${AI_TASK_MODEL_API_KEY:-}
      AI_TASK_MODEL_ENABLE_THINKING: ${AI_TASK_MODEL_ENABLE_THINKING:-0}
      AI_NPC_MODEL_ENABLED: ${AI_NPC_MODEL_ENABLED:-0}
      AI_NPC_MODEL_URL: ${AI_NPC_MODEL_URL:-}
      AI_NPC_MODEL_NAME: ${AI_NPC_MODEL_NAME:-}
      AI_NPC_MODEL_API_KEY: ${AI_NPC_MODEL_API_KEY:-}
      AI_NPC_MODEL_TIMEOUT_MS: ${AI_NPC_MODEL_TIMEOUT_MS:-10000}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  world-viewer:
    build: {context: docker/world-viewer}
    restart: unless-stopped
    environment:
      WORLD_VIEWER_TELEMETRY_TOKEN: ${WORLD_VIEWER_TELEMETRY_TOKEN:?Set a separate lab token}
      LAB_AI_PROFILE: ${LAB_AI_PROFILE:-settlement-v8}
      CHARACTER_STUDIO_PORT: ${CHARACTER_STUDIO_PORT:-9092}
    command: [python, /workspace/tools/realm_lab/run_scoped.py, uvicorn, app.main:app, --host, "0.0.0.0", --port, "8000"]
    volumes:
      - ./tools/realm_lab:/workspace/tools/realm_lab:ro
      - ./data/realm_lab:/workspace/data/realm_lab:ro
    ports:
      - "${LAB_VIEWER_PORT:-9091}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  character-studio:
    build: {context: docker/character-studio}
    restart: unless-stopped
    environment:
      LAB_AI_PROFILE: ${LAB_AI_PROFILE:-settlement-v8}
      CHARACTER_STUDIO_PROJECT_DIR: /workspace
      CHARACTER_STUDIO_DATA_DIR: /data
      CHARACTER_STUDIO_SOURCE_DIR: /source-profiles
      CHARACTER_STUDIO_APPEARANCE_DIR: /source-appearances
      CHARACTER_STUDIO_CATALOG: /catalog/catalog.json
      CHARACTER_STUDIO_MODEL_DATA_DIR: /model-data
      CHARACTER_STUDIO_AI_URL: http://ai-server:8000
      CHARACTER_STUDIO_PASSWORD: ${CHARACTER_STUDIO_PASSWORD:-}
    volumes:
      - character-studio-data:/data
      - ./data/npc_agents:/source-profiles:ro
      - ./data/npc_appearances:/source-appearances:ro
      - ./data/character_studio:/catalog:ro
      - ./tools/realm_lab:/workspace/tools/realm_lab:ro
      - ./data/realm_lab:/workspace/data/realm_lab:ro
      - ./runtime/lab/character-models:/model-data:ro
    ports:
      - "${CHARACTER_STUDIO_PORT:-9092}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tc-dev:
    profiles: [tools]
    build: *trinity-build
    image: aitc-lab-trinity-dev
    environment:
      <<: *lab-environment
      TC_AUTH_SERVER_USER: ${TC_AUTH_SERVER_USER:?Set the auth schema owner}
      TC_AUTH_SERVER_PASSWORD: ${TC_AUTH_SERVER_PASSWORD:?Set the auth schema owner password}
    volumes:
      - .:/workspace
      - build-data:/build
      - ccache-data:/ccache
      - ./runtime/lab/data:/runtime/data:ro
      - ./runtime/lab/logs:/runtime/logs
    command: [bash]
    stdin_open: true
    tty: true

  aiworld-recorder:
    profiles: [recording]
    image: python:3.11-slim
    restart: "no"
    init: true
    stop_grace_period: 20s
    depends_on:
      world-viewer:
        condition: service_healthy
    environment:
      LAB_AI_PROFILE: ${LAB_AI_PROFILE:-settlement-v8}
    command: [python, /workspace/tools/realm_lab/run_scoped.py, python, -u, /record.py, --url, "http://world-viewer:8000/api/state", --output, /recordings, --hours, "${AIWORLD_RECORD_HOURS:-4}", --interval, "${AIWORLD_RECORD_INTERVAL:-5}", --label, "${AIWORLD_RECORD_LABEL:-AI-World}", --build-label, "${AIWORLD_RECORD_BUILD_LABEL:-unknown}", --analyze, --minimum-minutes, "${AIWORLD_TEST_MINUTES:-60}"]
    volumes:
      - ./tools/realm_lab:/workspace/tools/realm_lab:ro
      - ./data/realm_lab:/workspace/data/realm_lab:ro
      - ./docker/world-viewer/app/record.py:/record.py:ro
      - ./docker/world-viewer/app/behavior.py:/behavior.py:ro
      - ./docker/world-viewer/app/recording_gate.py:/recording_gate.py:ro
      - ./docker/world-viewer/app/scope.py:/scope.py:ro
      - ./runtime/lab/recordings:/recordings

volumes:
  auth-mysql-data:
    name: aitc_auth_mysql-data
  mysql-data:
    name: aitc_lab_mysql-data
  build-data:
    name: aitc_lab_build-data
  ccache-data:
    name: aitc_lab_ccache-data
  character-studio-data:
    name: aitc_lab_character-studio-data
